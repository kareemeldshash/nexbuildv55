<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EngiHub – build it, show it, get hired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14142b;--mut:#5d5d78;--bg:#fff;--soft:#f4f6ff;--line:#e3e6f5;--blue:#2f5bff;--pink:#ff3d81;--lime:#b8f23a;--amber:#ffb800;--teal:#00c2a8;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo i{font-style:normal;background:var(--lime);padding:0 6px;border-radius:8px}
.links{display:flex;gap:6px;align-items:center}
.links a{padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
.links a:hover,.links a.on{background:var(--soft)}
.links a.cta{background:var(--ink);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:44px 28px;margin-bottom:26px;background:linear-gradient(135deg,#2f5bff,#7a3dff 55%,#ff3d81);color:#fff}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(90deg,transparent,#000 70%)}
.hero h1{position:relative;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-2px;font-weight:800;max-width:640px}
.hero p{position:relative;margin:14px 0 22px;max-width:480px;opacity:.92;font-size:18px}
.hero .btn{position:relative}
.gear{position:absolute;right:-40px;top:-40px;width:260px;opacity:.9;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{position:relative;display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stats span{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:99px;font-weight:600}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:12px 22px;border-radius:99px;background:var(--lime);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}.btn.ghost{background:var(--soft)}
.btn:hover{transform:translateY(-2px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
.bar input{flex:1;min-width:200px;width:auto}.bar select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px}
.chip{flex:none;padding:7px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.chip.on{color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:block;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--ink)}
.cv{position:relative;height:150px;display:grid;place-items:center;font-size:44px;color:#fff;font-weight:800}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:10px;top:10px;color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.cb{padding:14px 16px}.cb h3{font-size:18px;line-height:1.2}.cb p{color:var(--mut);font-size:14px;margin:6px 0 10px;min-height:42px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);align-items:center}.meta b{color:var(--ink);background:var(--lime);padding:2px 10px;border-radius:99px}
.panel{border:2px solid var(--line);border-radius:24px;padding:24px;background:#fff}
.narrow{max-width:520px;margin:20px auto}
.panel label{display:block;font-weight:600;margin:14px 0 6px}
h2{font-size:30px;letter-spacing:-1px;margin-bottom:14px}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:#fff}
.row:hover{border-color:var(--ink)}
.rk{font-weight:800;font-size:22px;width:36px;text-align:center}
.av{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.grow{flex:1;min-width:0}.grow small{color:var(--mut)}
.bg{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:6px}
.sc{font-weight:800;font-size:22px}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.skills span{background:var(--soft);padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600}
.cvhead{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cvhead .av{width:84px;height:84px;font-size:40px;border-radius:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0}
.kpis div{background:var(--soft);border-radius:16px;padding:12px;text-align:center}.kpis b{display:block;font-size:28px}
.pd{display:grid;gap:20px;grid-template-columns:1.2fr 1fr}
.pd .big{border-radius:24px;overflow:hidden;min-height:260px;position:relative;display:grid;place-items:center;font-size:80px;color:#fff}
.pd .big img{width:100%;display:block}
.like{font-size:18px}.like.on{background:var(--pink);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
.empty{text-align:center;padding:40px;color:var(--mut)}
footer{text-align:center;color:var(--mut);padding:30px 20px 90px;font-size:14px}
@media(max-width:700px){
 .links{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
 .links a{padding:8px 10px;font-size:14px}
 .pd{grid-template-columns:1fr}.hero{padding:32px 20px}.gear{width:180px}
 #toast{bottom:100px}
}
@media print{header,.links,footer,.noprint,#toast{display:none!important}main{padding:0}}
@media(prefers-reduced-motion:reduce){.gear{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header><a class="logo" href="#/">Engi<i>Hub</i></a><nav class="links" id="nav"></nav></header>
<main id="app"></main>
<footer>EngiHub – a home for engineering projects.</footer>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://bwctasiftanzitpxjhqe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y3Rhc2lmdGFueml0cHhqaHFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTY2MjEsImV4cCI6MjEwNzgzMjYyMX0.LLP3fJgN78DGwC225xP3iQzAhviYO0n09j8dwFCgM2Q');
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={Robotics:'#2f5bff',Embedded:'#00c2a8',IoT:'#ff3d81',CAD:'#e69a00',Software:'#7a3dff',Other:'#64748b'};
const COL=['#2f5bff','#ff3d81','#00c2a8','#e69a00','#7a3dff'];
const col=s=>COL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const score=r=>r.projects*10+r.likes*3+r.views;
const badge=s=>s>=500?['Legend','#ff3d81']:s>=200?['Maker','#2f5bff']:s>=50?['Builder','#00c2a8']:['Rookie','#e69a00'];
let me=null,F={q:'',cat:'All',sort:'created_at'};
const V=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
const avatar=n=>`<div class="av" style="background:${col(n)}">${e(String(n)[0]||'?').toUpperCase()}</div>`;
const bdg=s=>{const[b,c]=badge(s);return `<span class="bg" style="background:${c}">${b}</span>`};

function nav(){
 const h=location.hash||'#/';
 const l=(href,t,c='')=>`<a href="${href}" class="${c} ${h===href?'on':''}">${t}</a>`;
 $('#nav').innerHTML=l('#/','Explore')+l('#/top','Leaderboard')+(me?l('#/new','Share','cta')+l('#/u/'+me.id,'My CV'):l('#/auth','Sign in','cta'));
}
const card=p=>`<a class="card" href="#/p/${p.id}"><div class="cv" style="background:${CATS[p.category]||CATS.Other}">${e(p.title[0]).toUpperCase()}${p.cover?`<img src="${e(p.cover)}" alt="" loading="lazy">`:''}<span class="tag" style="background:${CATS[p.category]||CATS.Other}">${e(p.category)}</span></div><div class="cb"><h3>${e(p.title)}</h3><p>${e(p.description).slice(0,85)}</p><div class="meta"><span>@${e(p.username)}</span><span>♥ ${p.likes} · 👁 ${p.views}</span><b>${p.price>0?'$'+p.price:'Free'}</b></div></div></a>`;

async function home(){
 V(`<section class="hero"><svg class="gear" viewBox="0 0 100 100" aria-hidden="true"><path fill="#b8f23a" fill-opacity=".85" d="M44 4h12l2 10 7 3 9-6 8 8-6 9 3 7 10 2v12l-10 2-3 7 6 9-8 8-9-6-7 3-2 10H44l-2-10-7-3-9 6-8-8 6-9-3-7-10-2V44l10-2 3-7-6-9 8-8 9 6 7-3zM50 33a17 17 0 100 34 17 17 0 000-34z" fill-rule="evenodd"/></svg><h1>Build it. Show it. Get hired.</h1><p>Share your engineering projects, earn points when people like them, and let your profile work as your CV.</p><a class="btn" href="${me?'#/new':'#/auth'}">Share a project</a><div class="stats" id="st"></div></section>
 <div class="bar"><input id="q" placeholder="Search projects…" value="${e(F.q)}" aria-label="Search"><select id="so" aria-label="Sort"><option value="created_at">Newest</option><option value="likes">Most liked</option><option value="views">Most viewed</option></select></div>
 <div class="chips">${['All',...Object.keys(CATS)].map(c=>`<button class="chip ${F.cat===c?'on':''}" data-c="${c}" style="${F.cat===c?'background:'+(CATS[c]||'#14142b'):''}">${c}</button>`).join('')}</div><div class="grid" id="gr"></div>`);
 $('#so').value=F.sort;
 $('#q').oninput=ev=>{F.q=ev.target.value;clearTimeout(home.t);home.t=setTimeout(list,250)};
 $('#so').onchange=ev=>{F.sort=ev.target.value;list()};
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F.cat=b.dataset.c;home()});
 const [a,b]=await Promise.all([SB.from('projects').select('*',{count:'exact',head:true}),SB.from('profiles').select('*',{count:'exact',head:true})]);
 if($('#st'))$('#st').innerHTML=`<span>${a.count??0} projects</span><span>${b.count??0} makers</span>`;
 list();
}
async function list(){
 let q=SB.from('project_feed').select('*').order(F.sort,{ascending:false}).limit(60);
 if(F.cat!=='All')q=q.eq('category',F.cat);
 if(F.q)q=q.ilike('title','%'+F.q.replace(/[%,]/g,'')+'%');
 const{data,error}=await q;
 if(!$('#gr'))return;
 if(error)return $('#gr').innerHTML=`<p class="empty">Could not load projects: ${e(error.message)}. Did you run supabase-setup.sql?</p>`;
 $('#gr').innerHTML=data.length?data.map(card).join(''):'<p class="empty">No projects yet. Be the first to share one.</p>';
}

async function project(id){
 const{data:p}=await SB.from('project_feed').select('*').eq('id',id).single();
 if(!p)return V('<p class="empty">Project not found.</p>');
 SB.rpc('add_view',{pid:id});
 let liked=false;
 if(me){const{data}=await SB.from('likes').select('usr').eq('project',id).eq('usr',me.id);liked=!!data?.length}
 const c=CATS[p.category]||CATS.Other;
 V(`<div class="pd"><div class="big" style="background:${c}">${p.cover?`<img src="${e(p.cover)}" alt="">`:e(p.title[0]).toUpperCase()}</div>
 <div class="panel"><span class="bg" style="background:${c};margin:0">${e(p.category)}</span><h2 style="margin-top:10px">${e(p.title)}</h2>
 <a href="#/u/${p.owner}" class="row" style="margin:10px 0">${avatar(p.username)}<div class="grow"><b>@${e(p.username)}</b><br><small>${new Date(p.created_at).toLocaleDateString()}</small></div></a>
 <p style="white-space:pre-wrap">${e(p.description)}</p>
 <p style="margin:16px 0"><b style="font-size:26px">${p.price>0?'$'+p.price:'Free'}</b> · 👁 ${p.views+1}</p>
 <button class="btn like ${liked?'on':'ghost'}" id="lk">♥ <span id="ln">${p.likes}</span></button>
 ${me&&me.id===p.owner?'<button class="btn ghost" id="del">Delete</button>':''}</div></div>`);
 $('#lk').onclick=async()=>{
  if(!me)return location.hash='#/auth';
  const r=liked?await SB.from('likes').delete().eq('project',id).eq('usr',me.id):await SB.from('likes').insert({project:id,usr:me.id});
  if(r.error)return toast(r.error.message);
  liked=!liked;$('#ln').textContent=+$('#ln').textContent+(liked?1:-1);$('#lk').className='btn like '+(liked?'on':'ghost');
 };
 if($('#del'))$('#del').onclick=async()=>{if(confirm('Delete this project?')){await SB.from('projects').delete().eq('id',id);toast('Deleted');location.hash='#/'}};
}

async function top(){
 const{data,error}=await SB.from('leaderboard').select('*');
 if(error)return V(`<p class="empty">${e(error.message)}</p>`);
 const rows=data.map(r=>({...r,s:score(r)})).sort((a,b)=>b.s-a.s).slice(0,50);
 V(`<h2>Leaderboard</h2><p style="color:var(--mut);margin-bottom:16px">Score = 10 per project + 3 per like + 1 per view.</p><div class="rows">${rows.map((r,i)=>`<a class="row" href="#/u/${r.id}"><div class="rk" style="color:${['#e69a00','#8a94a8','#c0703a'][i]||'var(--mut)'}">${i<3?['🥇','🥈','🥉'][i]:i+1}</div>${avatar(r.username)}<div class="grow"><b>@${e(r.username)}</b>${bdg(r.s)}<br><small>${r.projects} projects · ♥ ${r.likes} · 👁 ${r.views}</small></div><div class="sc">${r.s}</div></a>`).join('')||'<p class="empty">Nobody yet.</p>'}</div>`);
}

async function user(id){
 const[{data:r},{data:ps}]=await Promise.all([SB.from('leaderboard').select('*').eq('id',id).single(),SB.from('project_feed').select('*').eq('owner',id).order('created_at',{ascending:false})]);
 if(!r)return V('<p class="empty">Profile not found.</p>');
 const s=score(r),own=me&&me.id===id;
 V(`<div class="panel"><div class="cvhead">${avatar(r.username)}<div class="grow"><h2 style="margin:0">@${e(r.username)} ${bdg(s)}</h2><p style="color:var(--mut)">${e(r.bio)||'No bio yet.'}</p></div><button class="btn dark noprint" onclick="print()">Download CV (PDF)</button></div>
 <div class="skills">${r.skills.split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${e(x)}</span>`).join('')}</div>
 <div class="kpis"><div><b>${s}</b>score</div><div><b>${r.projects}</b>projects</div><div><b>${r.likes}</b>likes</div><div><b>${r.views}</b>views</div></div>
 ${own?`<details class="noprint"><summary class="btn ghost">Edit profile</summary><label>Bio</label><textarea id="bio" rows="3" maxlength="300">${e(r.bio)}</textarea><label>Skills (comma separated)</label><input id="sk" value="${e(r.skills)}" placeholder="Arduino, SolidWorks, ESP32"><br><br><button class="btn dark" id="sv">Save</button> <button class="btn ghost" id="out">Sign out</button></details>`:''}</div>
 <h2 style="margin-top:26px">Projects</h2><div class="grid">${ps.map(card).join('')||'<p class="empty">No projects yet.</p>'}</div>`);
 if(own){
  $('#sv').onclick=async()=>{const{error}=await SB.from('profiles').update({bio:$('#bio').value,skills:$('#sk').value}).eq('id',id);toast(error?error.message:'Saved');if(!error)user(id)};
  $('#out').onclick=()=>SB.auth.signOut().then(()=>location.hash='#/');
 }
}

function auth(mode='in'){
 const up=mode==='up';
 V(`<div class="panel narrow"><h2>${up?'Create your account':'Welcome back'}</h2>
 ${up?'<label>Username</label><input id="un" maxlength="24" autocomplete="username">':''}
 <label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" minlength="6" autocomplete="${up?'new':'current'}-password">
 <br><br><button class="btn dark" id="go" style="width:100%">${up?'Sign up':'Sign in'}</button>
 <p style="margin-top:14px;text-align:center"><a href="#" id="sw" style="color:var(--blue);font-weight:600">${up?'Have an account? Sign in':'New here? Create an account'}</a></p></div>`);
 $('#sw').onclick=ev=>{ev.preventDefault();auth(up?'in':'up')};
 $('#go').onclick=async()=>{
  const email=$('#em').value.trim(),password=$('#pw').value;
  if(!email||password.length<6)return toast('Enter an email and a password of 6+ characters');
  if(up){
   const{data,error}=await SB.auth.signUp({email,password,options:{data:{username:$('#un').value.trim()},emailRedirectTo:location.origin}});
   if(error)return toast(error.message);
   if(!data.session)return V('<div class="panel narrow"><h2>Check your email</h2><p>We sent you a verification link. Click it, then sign in.</p></div>');
  }else{
   const{error}=await SB.auth.signInWithPassword({email,password});
   if(error)return toast(error.message.includes('confirmed')?'Please verify your email first (check your inbox).':error.message);
  }
  location.hash='#/';
 };
}

function form(){
 if(!me)return location.hash='#/auth';
 V(`<div class="panel narrow"><h2>Share a project</h2>
 <label>Title</label><input id="t" maxlength="80"><label>Description</label><textarea id="d" rows="5"></textarea>
 <label>Category</label><select id="c">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select>
 <label>Price in USD (0 = free)</label><input id="p" type="number" min="0" value="0"><label>Cover image</label><input id="f" type="file" accept="image/*">
 <br><br><button class="btn dark" id="go" style="width:100%">Publish</button></div>`);
 $('#go').onclick=async()=>{
  const title=$('#t').value.trim();if(!title)return toast('Add a title');
  $('#go').disabled=true;let cover=null;const f=$('#f').files[0];
  if(f){
   if(f.size>3e6){$('#go').disabled=false;return toast('Image must be under 3 MB')}
   const path=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;
   const up=await SB.storage.from('covers').upload(path,f);
   if(up.error){$('#go').disabled=false;return toast(up.error.message)}
   cover=SB.storage.from('covers').getPublicUrl(path).data.publicUrl;
  }
  const{data,error}=await SB.from('projects').insert({owner:me.id,title,description:$('#d').value,category:$('#c').value,price:+$('#p').value||0,cover}).select().single();
  if(error){$('#go').disabled=false;return toast(error.message)}
  toast('Published!');location.hash='#/p/'+data.id;
 };
}

function route(){
 nav();
 const[,a,b]=(location.hash||'#/').split('/');
 if(a==='p'&&b)project(b);else if(a==='u'&&b)user(b);else if(a==='top')top();else if(a==='new')form();else if(a==='auth')auth();else home();
}
addEventListener('hashchange',route);
SB.auth.onAuthStateChange((_,s)=>{const was=me?.id;me=s?.user||null;if(was!==me?.id)route()});
SB.auth.getSession().then(({data})=>{me=data.session?.user||null;route()});
</script>
</body>
</html>
